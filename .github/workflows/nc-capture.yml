name: Capture NC Korean originals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture L2 Update articles (MVP, text only)
        run: python scripts/collect_nc_sources.py --board l2update --no-attachments --output nc-capture
      - name: Generate first-run editorial fingerprint report
        run: python scripts/compare_nc_capture.py nc-capture --output nc-capture/editorial-diff.json
      - name: Upload original JSON and editorial report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-l2update-originals
          path: nc-capture/
          retention-days: 14
          if-no-files-found: warn
