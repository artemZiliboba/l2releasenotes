name: Capture NC Korean originals
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l2update-registry
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load previous source registry (if initialized)
        shell: bash
        run: |
          if git fetch origin refs/heads/state/l2update:refs/remotes/origin/state/l2update; then
            git show origin/state/l2update:state/l2update.json > previous-registry.json
            echo "Registry found"
          else
            echo "No registry branch yet; establishing baseline"
          fi
      - name: Capture latest 18 L2 Update articles
        run: python scripts/collect_nc_sources.py --board l2update --no-attachments --output nc-capture
      - name: Compare and preserve observed fingerprints
        run: |
          python scripts/update_nc_registry.py nc-capture --previous previous-registry.json --registry nc-capture/registry.json --report nc-capture/editorial-diff.json
      - name: Upload original JSON and editorial report
        uses: actions/upload-artifact@v4
        with:
          name: nc-l2update-originals
          path: nc-capture/
          retention-days: 14
          if-no-files-found: error
      - name: Persist registry on dedicated state branch
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/state/l2update; then
            git switch -C state/l2update origin/state/l2update
          else
            git switch -c state/l2update
          fi
          mkdir -p state
          cp nc-capture/registry.json state/l2update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/l2update.json
          if git diff --cached --quiet; then
            echo "Registry unchanged"
          else
            git commit -m "Update observed L2 Update source fingerprints"
            git push origin HEAD:refs/heads/state/l2update
          fi
