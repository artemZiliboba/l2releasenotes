name: Telegram — published patch notes
on:
  workflow_run:
    workflows: ["Deploy Pages"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Find preceding successful Pages deployment
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.event.workflow_run.id }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/workflows/pages.yml/runs?branch=master&status=success&per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "User-Agent": "l2-telegram-notifier"})
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]
          current = int(os.environ["CURRENT_RUN"])
          older = [r for r in runs if r["id"] < current and r.get("head_sha") != os.environ["CURRENT_SHA"]]
          older.sort(key=lambda r: r["id"], reverse=True)
          before = older[0]["head_sha"] if older else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"before={before}", file=f)
          PY
      - name: Notify Telegram about new published articles
        if: ${{ steps.previous.outputs.before != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ steps.previous.outputs.before }}
          AFTER: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/telegram_notify.py deployed --before "$BEFORE" --after "$AFTER"
