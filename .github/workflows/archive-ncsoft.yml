name: Archive NCSoft sources
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncsoft-source-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Download and validate official NCSoft list
        run: python scripts/archive_ncsoft.py
      - name: Commit changed snapshots to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-snapshots/l2update
          if git diff --cached --quiet; then
            echo "No changes in NCSoft list records"
            exit 0
          fi
          git commit -m "Archive latest official NCSoft l2update records"
          git pull --rebase origin master
          git push origin HEAD:master
