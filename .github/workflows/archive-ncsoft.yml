name: Archive NCSoft sources (every 3 hours)
on:
  # Moscow time (MSK, UTC+3): 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00.
  # GitHub Actions cron uses UTC; a three-hour interval aligns with the same clock hours in MSK.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncsoft-source-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Download and validate full official NCSoft articles
        run: python scripts/archive_ncsoft.py
      - name: Commit changed snapshots to master
        id: archive_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-snapshots/l2update
          if git diff --cached --quiet; then
            echo "No changes in NCSoft source archive"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Archive latest official NCSoft l2update records"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Notify Telegram only for new or revised Korean article bodies
        if: steps.archive_commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_ncsoft_archive.py
